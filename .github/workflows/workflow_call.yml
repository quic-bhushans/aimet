name: Test workflow call

on:
  push:
    branches:
      - develop

  workflow_call:
    inputs:
      src_branch:
        description: "Internal source branch to sync"
        required: false
        default: "develop"
        type: string
      dst_branch:
        description: "External destination branch to sync"
        required: false
        default: "develop"
        type: string

env:
  TEST: "value of var is TEST"

jobs:

  set_variables:
    runs-on: ubuntu-latest
    environment: "custom-prod"
    steps:
      - name: "Set environment variables"
        run: |
          echo "Var: ${{ env.TEST }}"
          echo "branch name: ${{ github.ref_name }}"
          echo "EVENT NAME: " ${{ github.event_name }}
          if [[ ${{ github.event_name }} == "push" ]]; then
            echo "In push event"
            echo "SRC_BRANCH=${{ env.DEFAULT_SRC_BRANCH }}" >> $GITHUB_ENV
            echo "DST_BRANCH=${{ env.DEFAULT_DST_BRANCH }}" >> $GITHUB_ENV
          else
            echo "In non push event"
            a_var="A VAR"
            echo $a_var
            SRC_BRANCH="${{ inputs.src_branch }}"
          fi
          echo src: $SRC_BRANCH
      - name: "Get inputs"
        run: |
          echo "EVENT NAME: " ${{ github.event_name }}
          echo "inputs: src_branch:" $SRC_BRANCH
