name: Workflow call

on:

  workflow_dispatch:
    inputs:
      src_branch:
        description: "Internal source branch to sync"
        required: false
        default: "develop"
        type: string
      dst_branch:
        description: "External destination branch to sync"
        required: false
        default: "develop"
        type: string

jobs:

  job-0:
    if: ${{ inputs.dst_branch == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: "run1"
        run: |
          echo "running job0"
          exit 1

  job-1:
    if: ${{ inputs.src_branch == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: "run1"
        run: |
          echo "running on src_branch == develop"
  job-2:
    needs: [job-0, job-1]
    if: ${{ needs.job-1.result == 'success' || needs.job-1.result == 'skipped' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: "run1"
        run: |
          echo "running on job2"
          echo ${{ needs.job1.result }}
    
